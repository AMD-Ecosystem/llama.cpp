name: "Linux - Setup HRX SDK"
description: "Build the HRX SDK from the release source and install it"
inputs:
  path:
    description: "Installation path"
    required: true
  version:
    description: "HRX SDK version (e.g., 0.2.0)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Download HRX SDK source
      uses: ./.github/actions/unarchive-tar
      with:
        url: https://github.com/ROCm/hrx-system/archive/refs/tags/v${{ inputs.version }}.tar.gz
        path: ${{ runner.temp }}/hrx-system
        type: z
        strip: 1

    - name: Build and install HRX SDK
      shell: bash
      run: |
        prefix=$(realpath -m "${{ inputs.path }}")
        cd "${{ runner.temp }}/hrx-system"
        python3 dev.py cmake setup
        source .venv/bin/activate
        # BUILD_SHARED_LIBS=OFF puts the private runtime into libhrx.so
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_INSTALL_LIBDIR=lib \
          -DBUILD_SHARED_LIBS=OFF \
          -DIREE_ENABLE_WERROR_FLAG=OFF \
          -DLIBHRX_BUILD=ON \
          -DLIBHRX_BUILD_HIP_BINDING=OFF \
          -DLIBHRX_BUILD_PASSTHROUGH=OFF \
          -DLIBHRX_BUILD_CTS=OFF
        cmake --build build -j $(nproc) --target hrx hrx-info loomc_shared
        cmake --install build --prefix "$prefix" --component HrxPublicDist --strip
        cp LICENSE "$prefix/LICENSE"
        cd "$GITHUB_WORKSPACE"
        rm -rf "${{ runner.temp }}/hrx-system"
